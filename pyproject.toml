[project]
name = "durable-agentic-coding-runtime"
version = "0.1.0"
description = "Workflow-engine-backed coding agent runtime."
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1.0",
    "httpx>=0.27.0",
    "openai>=1.93.0",
    "pydantic>=2.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "watchfiles>=0.21.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires external services such as Docker or Temporal-Light",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
